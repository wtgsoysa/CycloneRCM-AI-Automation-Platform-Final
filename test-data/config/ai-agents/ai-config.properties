# AI Agents Configuration

## Test Generation Agent
ai.testgeneration.enabled=true
ai.testgeneration.model=gpt-4
ai.testgeneration.temperature=0.7
ai.testgeneration.max_tokens=2000

## Self Healing Agent
ai.selfhealing.enabled=true
ai.selfhealing.retry_attempts=3
ai.selfhealing.healing_strategies=xpath,css,image-based

## Failure Analysis Agent
ai.failureanalysis.enabled=true
ai.failureanalysis.model=gpt-4
ai.failureanalysis.categorize=true

## Data Generation Agent
ai.datageneration.enabled=true
ai.datageneration.realistic=true

## Locator Optimizer Agent
ai.locatoroptimizer.enabled=true
ai.locatoroptimizer.strategies=xpath,css,image

## Predictive Agent
ai.predictive.enabled=true
ai.predictive.model=random-forest
ai.predictive.threshold=0.65
